<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | re-habita</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header"></header>
  <main class="page">
    <section class="page-hero compact">
      <p class="eyebrow">Catalogo</p>
      <h1>Produtos</h1>
      <p>Design vintage recondicionado, pronto para novas casas, escritorios e projetos.</p>
    </section>
    <section class="shop-layout">
      <aside class="filters">
        <h2>Filtrar</h2>
        <button data-filter="all" class="active">Todos</button>
        <button data-filter="chairs">Cadeiras</button>
        <button data-filter="sofas">Sofas e poltronas</button>
        <button data-filter="tables">Mesas</button>
        <button data-filter="lighting">Iluminacao</button>
        <button data-filter="storage">Armarios</button>
        <button data-filter="office">Escritorio</button>
      </aside>
      <div>
        <div class="shop-toolbar">
          <p><span data-result-count>0</span> pecas encontradas</p>
          <label>Ordenar
            <select data-sort>
              <option value="featured">Destaques</option>
              <option value="price-low">Preco crescente</option>
              <option value="price-high">Preco decrescente</option>
            </select>
          </label>
        </div>
        <div class="product-grid" data-product-list="all"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <div class="search-overlay" hidden></div>
  <script src="assets/app.js"></script>
</body>
</html>
