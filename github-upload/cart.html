<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | re-habita</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header"></header>
  <main class="page">
    <section class="page-hero compact">
      <p class="eyebrow">Reserva</p>
      <h1>Carrinho</h1>
      <p>As pecas vintage sao unicas. Envie o pedido e confirmamos disponibilidade, transporte e condicoes.</p>
    </section>
    <section class="cart-layout">
      <div data-cart-items class="cart-items"></div>
      <aside class="cart-summary">
        <h2>Resumo</h2>
        <p>Total estimado <strong data-cart-total>0 EUR</strong></p>
        <a class="solid-button" href="contact.html">Pedir confirmacao</a>
      </aside>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <div class="search-overlay" hidden></div>
  <script src="assets/app.js"></script>
</body>
</html>
